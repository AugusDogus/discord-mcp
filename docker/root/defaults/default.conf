# Replaces the Selkies default site. init-nginx substitutes SUBFOLDER and CWS.
# Publish only on the host loopback; Tailscale Serve supplies identity headers.
server {
  listen 3000 default_server;
  server_tokens off;
  client_max_body_size 1m;

  location / {
    proxy_pass              http://127.0.0.1:3100;
    proxy_http_version      1.1;
    proxy_set_header        Host $host;
    proxy_set_header        Connection "";
    proxy_buffering         off;
    proxy_request_buffering off;
    proxy_read_timeout      600s;
    proxy_send_timeout      600s;
  }

  # Extension reports go directly to Next over loopback, never through nginx.
  location = /api/internal/login-report {
    return 404;
  }

  location = /_discord-mcp/login-browser-auth {
    internal;
    proxy_pass              http://127.0.0.1:3100/api/discord/login/authorize;
    proxy_pass_request_body off;
    proxy_set_header        Content-Length "";
    proxy_set_header        Host $host;
  }

  location SUBFOLDER {
    auth_request            /_discord-mcp/login-browser-auth;
    alias                   /usr/share/selkies/web/;
    index                   index.html;
    try_files               $uri $uri/ =404;
    add_header              Cache-Control "no-store" always;
  }

  location SUBFOLDERapi {
    auth_request            /_discord-mcp/login-browser-auth;
    proxy_set_header        Upgrade $http_upgrade;
    proxy_set_header        Connection "upgrade";
    proxy_set_header        Host $host;
    proxy_http_version      1.1;
    proxy_read_timeout      3600s;
    proxy_send_timeout      3600s;
    proxy_buffering         off;
    proxy_request_buffering off;
    client_max_body_size    0;
    proxy_pass              http://127.0.0.1:CWS;
  }
}
